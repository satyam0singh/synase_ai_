<svg class="brand-mark-svg" viewBox="0 0 100 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pGradA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3279f9"/>
      <stop offset="100%" stop-color="#1a73e8"/>
    </linearGradient>
    <linearGradient id="pGradB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3279f9"/>
      <stop offset="100%" stop-color="#1a73e8"/>
    </linearGradient>
    <linearGradient id="pGradC" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1557b0"/>
      <stop offset="100%" stop-color="#45474d"/>
    </linearGradient>
    <filter id="penroseGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#1557b0" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g class="penrose-tribar" stroke-linejoin="round" stroke-linecap="round">
    <!-- Top-Right face -->
    <path d="M50 6 L92 78 L76 78 L42 20 L50 6 Z" fill="url(#pGradA)" fill-opacity="0.25" stroke="#3279f9" stroke-width="2.2" />
    <!-- Bottom face -->
    <path d="M92 78 L8 78 L16 64 L76 64 L76 78 Z" fill="url(#pGradB)" fill-opacity="0.28" stroke="#1557b0" stroke-width="2.2" />
    <!-- Left-Inner face completing the impossible loop -->
    <path d="M8 78 L50 6 L58 20 L24 78 L8 78 Z" fill="url(#pGradC)" fill-opacity="0.22" stroke="#45474d" stroke-width="2.2" />
    <!-- Inner optical illusion contours -->
    <path d="M42 20 L58 20 L30 68 L74 68 L66 54 L38 54 L50 34" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.6" fill="none" />
  </g>
</svg>