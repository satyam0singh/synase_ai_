<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f9fc" />
    <meta name="description" content="SYNASE AI — Decision Intelligence Console" />
    <title>SYNASE AI · Console</title>
    <link rel="icon" type="image/svg+xml" href="./src/assets/favicon.svg" />
    <link rel="apple-touch-icon" href="./src/assets/logo-mark.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/styles/app.css?v=9" />
    <link rel="stylesheet" href="./src/styles/home/dashboard.css?v=9" />
    <link rel="stylesheet" href="./src/styles/integrations/integrations.css?v=9" />
    <link rel="stylesheet" href="./src/styles/work/work.css?v=9" />
    <link rel="stylesheet" href="./src/styles/product/product.css?v=9" />
    <link rel="stylesheet" href="./src/styles/settings/settings.css?v=9" />
    <script>
      /* set the theme before first paint so there is no flash */
      (function () {
        try {
          var saved = localStorage.getItem('synase-theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app" aria-live="polite"></div>
    <noscript>SYNASE AI requires JavaScript to run this frontend prototype.</noscript>
    <script type="module" src="./src/app/main.js?v=9"></script>
    <script>
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
